const read=(k,f)=>{try{return JSON.parse(localStorage.getItem('ff-aurora-cinematic:'+k))??f}catch{return f}};

let state,mode='daily',wordLength=read('ff-length',5)===6?6:5,hard=read('ff-hard',false),toastTimer=null;
function localDay(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dayNumber(){const [y,m,d]=localDay().split('-').map(Number);return Math.max(1,Math.floor((Date.UTC(y,m-1,d)-Date.UTC(2026,9,13))/86400000)+1)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),16777619)}return h>>>0}
function answerBank(){return wordLength===6?ANSWERS6:ANSWERS}
function validBank(){return wordLength===6?VALID6:VALID5}
function solution(seed){const bank=answerBank();return bank[hash('fiveandfound:'+wordLength+':'+seed)%bank.length]}
function lifetime(){let m=read('ff-lifetime-v1',null);if(m)return m;const st=read('ff-stats',{played:0}),h=read('ff-history',[]),extra=read('ff-continued-history',[]);m={attempted:Math.max(st.played||0,h.length),completed:Math.max(st.played||0,h.length),hints:h.reduce((n,x)=>n+(x.hints||0),0),withHints:h.filter(x=>x.solved&&(x.hints||0)>0).length+extra.filter(x=>(x.hints||0)>0).length,withoutHints:h.filter(x=>x.solved&&!(x.hints||0)).length+extra.filter(x=>!(x.hints||0)).length};save('ff-lifetime-v1',m);return m}

function lifetimePanel(){const s=lifetime();return '<section class="lifetime-section"><h3>Lifetime statistics</h3>'+[['Total puzzles attempted',s.attempted],['Total puzzles completed',s.completed],['Total hints used ever',s.hints],['Average hints per puzzle',(s.attempted?s.hints/s.attempted:0).toFixed(2)],['Puzzles solved with hints',s.withHints],['Puzzles solved without hints',s.withoutHints]].map(([k,v])=>'<div class="lifetime-row"><span>'+k+'</span><strong>'+v+'</strong></div>').join('')+'<p class="subtle">Completed = solved or reached six guesses. Solved includes optional extra guesses. Stored only on this device.</p></section>'}

function loadDaily(){const date=localDay();const key='ff-daily-'+wordLength+'-'+date;state=read(key,null);if(!state||state.answer!==solution(date))state=newState(solution(date));mode='daily';normalizeState();saveGame();render()}
function newUnlimited(){mode='unlimited';const last=read('ff-unlimited-'+wordLength,null);if(last&&!last.done){state=last;normalizeState();render();return}forceNewUnlimited()}
function forceNewUnlimited(){mode='unlimited';const seed=Date.now()+'-'+Math.random();let next=solution(seed);const bank=answerBank();if(state&&next===state.answer)next=bank[(bank.indexOf(next)+1)%bank.length];state=newState(next);saveGame();render()}
function normalizeState(){state.hints=Array.isArray(state.hints)?state.hints:[];if(state.hints.length)state.current=applyHints(state.current||'');state.continued=!!state.continued;state.recorded=!!state.recorded;if(!state.started)state.started=Date.now();if(state.done&&!state.finishedAt)state.finishedAt=state.started}
function seconds(){return Math.max(0,Math.floor(((state.done?(state.finishedAt||Date.now()):Date.now())-state.started)/1000)+(state.elapsedSeconds||0))}
function clock(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function tick(){if(state)$('timerLabel').textContent=clock(seconds())}
function useHint(){if(state.done||state.hints.length>=2)return;const indices=[...state.answer].map((_,i)=>i).filter(i=>!state.hints.includes(i)&&!state.guesses.some(g=>g[i]===state.answer[i]));if(!indices.length){showToast('Every letter is revealed');return}const i=indices[Math.floor(Math.random()*indices.length)];state.hints.push(i);lifetimeAdd('hints');state.current=applyHints(state.current);saveGame();render();showToast('Correct letter revealed')}
function applyHints(input){const chars=Array.from({length:wordLength},(_,i)=>input[i]&&input[i]!==' '?input[i]:' ');for(const i of state.hints)chars[i]=state.answer[i];return chars.join('')}
function saveGame(){save(mode==='daily'?'ff-daily-'+wordLength+'-'+localDay():'ff-unlimited-'+wordLength,state)}
function colorGuess(guess,answer){const result=Array(answer.length).fill('absent'),pool={};for(let i=0;i<answer.length;i++){if(guess[i]===answer[i])result[i]='correct';else pool[answer[i]]=(pool[answer[i]]||0)+1}for(let i=0;i<answer.length;i++)if(result[i]!=='correct'&&(pool[guess[i]]||0)>0){result[i]='present';pool[guess[i]]--}return result}
function render(){const grid=$('grid');grid.style.setProperty('--word-length',wordLength);grid.setAttribute('aria-label',`Six guesses of ${wordLength} letters each`);grid.innerHTML='';const rows=Math.max(6,state.guesses.length+(state.done?0:1));grid.style.gridTemplateRows=`repeat(${rows},var(--tile))`;for(let r=0;r<rows;r++){const guess=state.guesses[r];const letters=guess|| (r===state.guesses.length&&!state.done?state.current:'');const statuses=guess?colorGuess(guess,state.answer):[];for(let c=0;c<wordLength;c++){const tile=document.createElement('div');tile.className='tile'+(letters[c]&&letters[c]!==' '?' filled':'')+(statuses[c]?' '+statuses[c]:'')+(!guess&&r===state.guesses.length&&state.hints.includes(c)?' hinted':'');tile.textContent=(letters[c]&&letters[c]!==' '?letters[c]:'').toUpperCase();tile.setAttribute('role','gridcell');tile.setAttribute('aria-label',`Row ${r+1}, column ${c+1}, ${letters[c]||'empty'}${statuses[c]?', '+statuses[c]:''}`);grid.append(tile)}}renderKeys();updateSubmit();$('hintBtn').textContent=`Hint (${2-state.hints.length} left)`;$('hintBtn').disabled=state.done||state.hints.length>=2;tick();$('lengthBtn').textContent=wordLength+' letters';$('dailyBtn').classList.toggle('active',mode==='daily');$('unlimitedBtn').classList.toggle('active',mode==='unlimited');$('modeInfo').innerHTML=mode==='daily'?`<strong>Daily puzzle</strong> · #${dayNumber()}`:`<strong>Unlimited mode</strong> · play all you want`;}
function renderKeys(){const ranking={absent:1,present:2,correct:3},scores={};for(const g of state.guesses){const colors=colorGuess(g,state.answer);[...g].forEach((ch,i)=>{if(!scores[ch]||ranking[colors[i]]>ranking[scores[ch]])scores[ch]=colors[i]})}document.querySelectorAll('.key').forEach(el=>{el.classList.remove('correct','present','absent');const s=scores[el.dataset.key.toLowerCase()];if(s)el.classList.add(s)})}
function showToast(msg){const t=$('toast');t.textContent=msg;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),1700)}
function invalid(msg){showToast(msg);const row=state.guesses.length;[...$('grid').children].slice(row*wordLength,row*wordLength+wordLength).forEach(t=>{t.classList.remove('invalid');void t.offsetWidth;t.classList.add('invalid')})}
function hardValid(g){if(!hard||!state.guesses.length)return true;const fixed={},needed={};for(const prev of state.guesses){const statuses=colorGuess(prev,state.answer);const per={};[...prev].forEach((ch,i)=>{if(statuses[i]==='correct')fixed[i]=ch;if(statuses[i]==='correct'||statuses[i]==='present')per[ch]=(per[ch]||0)+1});for(const [ch,n]of Object.entries(per))needed[ch]=Math.max(needed[ch]||0,n)}for(const [i,ch]of Object.entries(fixed))if(g[+i]!==ch)return false;for(const [ch,n]of Object.entries(needed))if([...g].filter(x=>x===ch).length<n)return false;return true}
function updateSubmit(){const b=$('submitBtn');const full=state.current.length===wordLength&&!state.current.includes(' ');const invalid=full&&!validBank().has(state.current);b.className='submit-btn'+(invalid?' invalid-word':full?' ready':'');b.textContent=invalid?'Not a word':'Submit';b.disabled=state.done||!full||invalid;b.setAttribute('aria-label',b.textContent)}
function press(k){if(state.done)return;if(k==='ENTER'||k==='↵'){const g=state.current;if(g.length!==wordLength||g.includes(' ')){invalid('Not enough letters');return}if(!validBank().has(g)){invalid('Not in word list');return}if(!hardValid(g)){invalid('Use your revealed hints');return}state.guesses.push(g);state.current='';state.won=g===state.answer;state.done=state.won||(!state.continued&&state.guesses.length>=6);if(state.done){state.finishedAt=Date.now();finish()}saveGame();render();if(state.done)setTimeout(()=>showResults(),650);else if(state.won)showToast('Brilliant!');return}if(k==='BACKSPACE'||k==='⌫'){const chars=applyHints(state.current).split('');for(let i=wordLength-1;i>=0;i--){if(!state.hints.includes(i)&&chars[i]!==' '){chars[i]=' ';break}}state.current=chars.join('')}else if(/^[a-z]$/i.test(k)){const chars=applyHints(state.current).split('');for(let i=0;i<wordLength;i++){if(!state.hints.includes(i)&&chars[i]===' '){chars[i]=k.toLowerCase();break}}state.current=chars.join('')}saveGame();render()}
function finish(){if(state.recorded){if(state.won&&state.continued&&!state.continuedLogged){state.continuedLogged=true;lifetimeAdd(state.hints.length?'withHints':'withoutHints');const h=read('ff-continued-history',[]);h.push({date:localDay(),length:wordLength,guesses:state.guesses.length,seconds:seconds(),hints:state.hints.length});save('ff-continued-history',h.slice(-300))}return}state.recorded=true;lifetimeAdd('completed');if(state.won)lifetimeAdd(state.hints.length?'withHints':'withoutHints');const stats=read('ff-stats',{played:0,wins:0,streak:0,maxStreak:0,dist:[0,0,0,0,0,0],lastDailyWin:null});stats.played++;if(state.won&&!state.continued){stats.wins++;if(state.guesses.length<=6)stats.dist[state.guesses.length-1]++;if(mode==='daily'){const yDate=new Date();yDate.setDate(yDate.getDate()-1);const y=`${yDate.getFullYear()}-${String(yDate.getMonth()+1).padStart(2,'0')}-${String(yDate.getDate()).padStart(2,'0')}`;stats.streak=stats.lastDailyWin===y?stats.streak+1:1;stats.lastDailyWin=localDay()}stats.maxStreak=Math.max(stats.maxStreak,stats.streak)}else if(mode==='daily')stats.streak=0;save('ff-stats',stats);const history=read('ff-history',[]);history.push({date:localDay(),length:wordLength,mode,guesses:state.guesses.length,seconds:seconds(),hints:state.hints.length,solved:state.won,continued:state.continued});save('ff-history',history.slice(-300))}
function continuePuzzle(){state.done=false;state.continued=true;state.current=applyHints('');state.elapsedSeconds=seconds();state.started=Date.now();state.finishedAt=null;saveGame();close();render()}
function commentary(){const n=state.guesses.length,t=seconds(),h=state.hints.length;if(!state.won)return 'The word won this round. Rematch?';if(state.continued)return 'Persistence wins. The word eventually surrendered.';if(n<=2&&h===0)return t<90?'That was suspiciously fast. Are you secretly a dictionary?':'Two guesses? Show-off.';if(n<=3&&t<120)return 'Lightning round! The letters barely stood a chance.';if(n<=4&&h===0)return 'Nicely played. Your brain earned a victory lap.';if(h===2)return 'Two hints and a triumph. We call that teamwork.';if(n>=6)return 'A dramatic last-second rescue. Hollywood wants the rights.';if(t>600)return 'Slow-cooked to perfection. Excellent persistence.';return 'A respectable victory for Team Vocabulary.'}
async function definition(){const w=state.answer,p=$('definitionPanel');if(!p)return;p.textContent='Looking up definition…';try{const res=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(!res.ok)throw Error('Unavailable');const data=await res.json();const def=(data[0].meanings||[]).flatMap(m=>(m.definitions||[]).slice(0,1).map(d=>({type:m.partOfSpeech,text:d.definition}))).slice(0,3);if(!def.length)throw Error('Unavailable');p.textContent='';for(const item of def){const line=document.createElement('p'),em=document.createElement('em');em.textContent=item.type+': ';line.append(em,document.createTextNode(item.text));p.append(line)}}catch{p.innerHTML='Definition unavailable. <a target="_blank" rel="noopener" href="https://www.merriam-webster.com/dictionary/'+encodeURIComponent(w)+'">Look it up online ↗</a>'}}
function popup(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('backdrop').classList.add('show')}
function close(){ $('backdrop').classList.remove('show') }
function showHelp(){popup('How to play',`<p>Guess the ${wordLength}-letter word in <strong>six tries</strong>. Each guess must be a valid word. After each guess, the tiles show how close you are.</p><div class="examples"><div class="tile correct">S</div><div class="tile">T</div><div class="tile">O</div><div class="tile">R</div><div class="tile">M</div></div><p><strong>Green:</strong> S is in the right spot.</p><div class="examples"><div class="tile">P</div><div class="tile present">L</div><div class="tile">A</div><div class="tile">N</div><div class="tile">T</div></div><p><strong>Gold:</strong> L is in the word, but somewhere else.</p><div class="examples"><div class="tile">C</div><div class="tile">H</div><div class="tile absent">A</div><div class="tile">I</div><div class="tile">R</div></div><p><strong>Gray:</strong> A is not in the word.</p><p><strong>Daily</strong> gives one shared word per day. <strong>Unlimited</strong> lets you play as much as you like. All progress stays on this device.</p>`)}
function showResults(){const st=read('ff-stats',{played:0,wins:0,streak:0,maxStreak:0});const history=read('ff-history',[]),solved=history.filter(x=>x.solved),avg=solved.length?clock(Math.round(solved.reduce((v,x)=>v+x.seconds,0)/solved.length)):'—';const status=state.done?(state.won?(state.continued?'Puzzle completed':`Solved in ${state.guesses.length}/6`):'Six guesses used — keep going?'):'Your statistics';popup(status,`${state.done&&state.won?`<div class="answer">${state.answer.toUpperCase()}</div><div class="insight"><strong>${commentary()}</strong><p>${clock(seconds())} elapsed · ${state.guesses.length} guesses · ${state.hints.length} hints</p></div><button class="cta ghost" id="defineBtn">Dictionary definition ↗</button><div id="definitionPanel" class="def-panel" style="display:none"></div>`:''}<div class="statrow"><div class="stat"><strong>${st.played}</strong><span>Played</span></div><div class="stat"><strong>${st.played?Math.round(st.wins/st.played*100):0}%</strong><span>Win rate</span></div><div class="stat"><strong>${st.streak}</strong><span>Daily streak</span></div><div class="stat"><strong>${avg}</strong><span>Avg solve time</span></div></div>${lifetimePanel()}${state.done?'<button class="cta" id="shareBtn">Share result</button>':''}${state.done&&!state.won&&!state.continued?'<button class="cta ghost" id="continueBtn">Keep going — unlimited guesses →</button>':''}${mode==='unlimited'?'<button class="cta ghost" id="nextBtn">Next puzzle →</button>':'<button class="cta ghost" id="goUnlimitedBtn">Play unlimited →</button>'}`);if($('defineBtn'))$('defineBtn').onclick=()=>{$('definitionPanel').style.display='block';definition()};if($('continueBtn'))$('continueBtn').onclick=continuePuzzle;if($('shareBtn'))$('shareBtn').onclick=share;if($('nextBtn'))$('nextBtn').onclick=()=>{close();forceNewUnlimited()};if($('goUnlimitedBtn'))$('goUnlimitedBtn').onclick=()=>{close();newUnlimited()}}
async function share(){let grid=state.guesses.map(g=>colorGuess(g,state.answer).map(v=>({correct:'🟩',present:'🟨',absent:'⬛'})[v]).join('')).join('\n');const msg=`Five & Found ${wordLength} letters ${mode==='daily'?'#'+dayNumber():'Unlimited'} ${state.won?state.guesses.length:'X'}/6\n\n${grid}`;try{if(navigator.share)await navigator.share({text:msg});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);showToast('Copied to clipboard')}else{fallbackCopy(msg)}}catch(e){if(e.name!=='AbortError')fallbackCopy(msg)}}
function fallbackCopy(s){const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();showToast('Result copied')}
function showSettings(){popup('Settings',`<div class="switch-row"><div><strong>Hard mode</strong><p class="subtle">Revealed hints must be used in future guesses.</p></div><button class="toggle ${hard?'on':''}" id="hardToggle">${hard?'On':'Off'}</button></div><p>Made for word lovers. No tracking, no accounts, and absolutely no ads.</p><p class="subtle">Daily puzzles use your device’s local date. Stats and game progress are stored only in this browser.</p>`);$('hardToggle').onclick=()=>{hard=!hard;save('ff-hard',hard);showSettings()}}
$('submitBtn').onclick=()=>press('ENTER');$('hintBtn').onclick=useHint;setInterval(tick,1000);
$('lengthBtn').onclick=()=>{wordLength=wordLength===5?6:5;save('ff-length',wordLength);if(mode==='daily')loadDaily();else{state=null;newUnlimited()}};
document.querySelectorAll('.keyrow').forEach(row=>{for(const ch of row.dataset.keys){const b=document.createElement('button');b.className='key'+('↵⌫'.includes(ch)?' wide':'');b.textContent=ch==='↵'?'ENTER':ch==='⌫'?'⌫':ch;b.dataset.key=ch;b.setAttribute('aria-label',ch==='↵'?'Enter':ch==='⌫'?'Backspace':ch);b.onclick=()=>press(ch);row.append(b)}});
document.addEventListener('keydown',e=>{if($('backdrop').classList.contains('show')){if(e.key==='Escape')close();return}if(e.ctrlKey||e.altKey||e.metaKey)return;if(/^[a-z]$/i.test(e.key)||e.key==='Enter'||e.key==='Backspace'){e.preventDefault();press(e.key)}});
$('dailyBtn').onclick=loadDaily;$('unlimitedBtn').onclick=()=>{if(mode==='unlimited'){if(state.done)forceNewUnlimited();else showToast('Finish this puzzle first')}else newUnlimited()};$('helpBtn').onclick=showHelp;$('statsBtn').onclick=showResults;$('settingsBtn').onclick=showSettings;$('closeModal').onclick=close;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))close()};
loadDaily();
</script></body></html>
