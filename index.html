function continuePuzzle(){state.done=false;state.continued=true;state.current=applyHints('');state.elapsedSeconds=seconds();state.started=null;state.finishedAt=null;state.timerActivated=true;startTimer();saveGame();close();render()}
const RESULT_LINES={"giveup":["You surrendered to a collection of letters. Bold strategy.","The word wins by technical knockout. Your dignity is in recovery.","You tapped Give Up. The alphabet has been unbearable ever since.","A tactical withdrawal. Historians will be generous.","That word is going straight to its group chat to brag.","We all have limits. Apparently yours was this word.","The dictionary is acting like it won the Super Bowl. Embarrassing."],"continued":["Six guesses was apparently just a suggestion.","You didn't solve it within the rules. You did solve it. Lawyers can debate the rest.","The word requested a restraining order. You requested another guess.","You outlasted the word and the original game design.","An overtime victory. The rulebook is in shambles.","Persistence won. Efficiency declined to comment."],"perfect":["One guess? That's either brilliance or an inside job.","First try. The dictionary wants to see your phone.","One guess. Completely normal. Nothing suspicious here.","The word barely loaded before you embarrassed it.","A first-guess win? The other five rows would like a refund.","Outstanding. Please explain yourself to the vowels."],"two":["Two guesses. Did you even give the word a fighting chance?","The word barely had time to develop a personality.","Two tries. The dictionary is checking for leaks.","A two-guess solve? Humble bragging privileges granted.","The alphabet came prepared. You came overprepared."],"quick":["Done already? Some of us were still reading the instructions.","The word got absolutely speed-dated.","You solved it before the vowels finished their coffee.","That was fast enough to make the hint button nervous.","The puzzle had a whole plan. Shame about the execution."],"clean":["Zero hints. Someone is feeling academically superior.","The hint button has filed a complaint about lack of work.","No hints used. Very independent. Very smug.","The clues sat patiently while you showed off.","Unassisted victory. The dictionary will pretend not to care."],"one":["One hint? Consider it a professional consultation.","A little help, a lot of attitude. Fair enough.","One clue and you suddenly became an expert. Remarkable.","The hint button made a cameo and demanded producer credit.","One hint. Your secret is safe with absolutely nobody."],"twoHints":["Two hints. The answer was beginning to introduce itself.","The hint button did most of the introductions.","Two clues later, we have a scholar on our hands.","An impressive collaboration between you and the Help Department.","Two hints. Still technically a solo sport."],"three":["Three hints and a win. Every available resource was deployed.","The hints carried the supplies; you planted the flag.","Three clues. The word practically sent you a calendar invite.","You used the entire hint budget. Finance is concerned.","Maximum assistance, maximum confidence. We love the audacity."],"six":["Six guesses. Nothing like turning the final row into a hostage negotiation.","That came down to the wire. The wire would like a day off.","Final attempt. The word was already drafting its victory speech.","You won at the buzzer. The alphabet is demanding a replay.","Sixth guess heroics. Absolutely no unnecessary drama here."],"slow":["An artisanal solve. Handcrafted over several business minutes.","The word had time to start a family, but you got there.","A leisurely investigation. The suspect was eventually identified.","The letters aged gracefully while you considered your options.","Slow-roasted victory. Served with a side of stubbornness."],"general":["The word has been notified of its defeat.","The dictionary is coping as best it can.","Another victory for the human brain. Allegedly.","The consonants have retained legal counsel.","Well played. Try not to let it become your entire personality.","The word put up a fight. A brief, embarrassing fight.","You won. Please act surprised.","Your keyboard would like to take partial credit.","Case closed. The vowels are refusing interviews.","The alphabet underestimated you. Rookie mistake.","Nicely done. Your ego has been updated successfully.","The word has left the chat. No forwarding address."]};
function commentary(){const n=state.guesses.length,t=seconds(),h=state.hints.length;let group;if(state.gaveUp||!state.won)group='giveup';else if(state.continued)group='continued';else if(n===1)group='perfect';else if(h===3&&n>=5)group='three';else if(n===6)group='six';else if(n===2&&h===0)group='two';else if(t>=600)group='slow';else if(h===3)group='three';else if(h===2)group='twoHints';else if(h===1)group='one';else if(t<=75)group='quick';else if(h===0)group='clean';else group='general';const lines=RESULT_LINES[group];const line=lines[hash(state.answer+':'+n+':'+h+':'+t+':'+group)%lines.length];if(state.won&&!state.continued&&h===3&&n>=5)return clock(t)+', '+n+' guesses, all three hints. A full-scale operation just to bully a word.';if(state.won&&!state.continued&&t>=600&&h>=2)return clock(t)+' and '+h+' hints. The word really made you work for its autograph.';return line}
async function definition(){const w=state.answer,p=$('definitionPanel');if(!p)return;p.textContent='Looking up definition…';const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6500);try{const res=await fetch('https://api.datamuse.com/words?sp='+encodeURIComponent(w)+'&md=d&max=1',{signal:controller.signal});if(!res.ok)throw Error('Definition service unavailable');const entries=await res.json();const entry=entries.find(e=>e.word.toLowerCase()===w.toLowerCase());const defs=(entry?.defs||[]).slice(0,3);if(!defs.length)throw Error('No definition found');p.textContent='';for(const raw of defs){const cut=raw.indexOf('\\t'),kind=cut>=0?raw.slice(0,cut):'',meaning=cut>=0?raw.slice(cut+1):raw;const line=document.createElement('p'),em=document.createElement('em');const names={n:'noun',v:'verb',adj:'adjective',adv:'adverb',u:'other'};em.textContent=(names[kind]||kind||'definition')+': ';line.append(em,document.createTextNode(meaning));p.append(line)}const credit=document.createElement('small');credit.textContent='Definitions via Datamuse (Wiktionary / WordNet).';p.append(credit)}catch(e){p.textContent='Definition temporarily unavailable. ';const a=document.createElement('a');a.target='_blank';a.rel='noopener';a.href='https://www.merriam-webster.com/dictionary/'+encodeURIComponent(w);a.textContent='Look it up online ↗';p.append(a)}finally{clearTimeout(timeout)}}
function popup(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('backdrop').classList.add('show')}
function close(){ $('backdrop').classList.remove('show') }
function showHelp(){popup('How to play',`<p>Guess the ${wordLength}-letter word in <strong>six tries</strong>. Each guess must be a valid word. After each guess, the tiles show how close you are.</p><div class="examples"><div class="tile correct">S</div><div class="tile">T</div><div class="tile">O</div><div class="tile">R</div><div class="tile">M</div></div><p><strong>Green:</strong> S is in the right spot.</p><div class="examples"><div class="tile">P</div><div class="tile present">L</div><div class="tile">A</div><div class="tile">N</div><div class="tile">T</div></div><p><strong>Gold:</strong> L is in the word, but somewhere else.</p><div class="examples"><div class="tile">C</div><div class="tile">H</div><div class="tile absent">A</div><div class="tile">I</div><div class="tile">R</div></div><p><strong>Gray:</strong> A is not in the word.</p><p><strong>Daily</strong> gives one shared word per day. <strong>Unlimited</strong> lets you play as much as you like. All progress stays on this device.</p>`)}
function showResults(){const st=read('ff-stats',{played:0,wins:0,streak:0,maxStreak:0});const history=read('ff-history',[]),solved=history.filter(x=>x.solved),avg=solved.length?clock(Math.round(solved.reduce((v,x)=>v+x.seconds,0)/solved.length)):'—';const status=state.done?(state.won?(state.continued?'Puzzle completed':`Solved in ${state.guesses.length}/6`):(state.gaveUp?'Answer revealed':'Six guesses used — keep going?')):'Your statistics';popup(status,`${state.done&&(state.won||state.gaveUp)?`<div class="answer">${state.answer.toUpperCase()}</div><div class="insight"><strong>${commentary()}</strong><p>${clock(seconds())} elapsed · ${state.guesses.length} guesses · ${state.hints.length} hints</p></div><button class="cta ghost" id="defineBtn">Dictionary definition ↗</button><div id="definitionPanel" class="def-panel" style="display:none"></div>`:''}<div class="statrow"><div class="stat"><strong>${st.played}</strong><span>Played</span></div><div class="stat"><strong>${st.played?Math.round(st.wins/st.played*100):0}%</strong><span>Win rate</span></div><div class="stat"><strong>${st.streak}</strong><span>Daily streak</span></div><div class="stat"><strong>${avg}</strong><span>Avg solve time</span></div></div>${lifetimePanel()}${state.done?'<button class="cta" id="shareBtn">Share result</button>':''}${state.done&&!state.won&&!state.continued&&!state.gaveUp?'<button class="cta ghost" id="continueBtn">Keep going — unlimited guesses →</button>':''}${mode==='unlimited'?'<button class="cta ghost" id="nextBtn">Next puzzle →</button>':'<button class="cta ghost" id="goUnlimitedBtn">Play unlimited →</button>'}`);if($('defineBtn'))$('defineBtn').onclick=()=>{$('definitionPanel').style.display='block';definition()};if($('continueBtn'))$('continueBtn').onclick=continuePuzzle;if($('shareBtn'))$('shareBtn').onclick=share;if($('nextBtn'))$('nextBtn').onclick=()=>{close();forceNewUnlimited()};if($('goUnlimitedBtn'))$('goUnlimitedBtn').onclick=()=>{close();newUnlimited()}}
async function share(){let grid=state.guesses.map(g=>colorGuess(g,state.answer).map(v=>({correct:'🟩',present:'🟨',absent:'⬛'})[v]).join('')).join('\n');const msg=`Five & Found ${wordLength} letters ${mode==='daily'?'#'+dayNumber():'Unlimited'} ${state.won?state.guesses.length:'X'}/6\n\n${grid}`;try{if(navigator.share)await navigator.share({text:msg});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);showToast('Copied to clipboard')}else{fallbackCopy(msg)}}catch(e){if(e.name!=='AbortError')fallbackCopy(msg)}}
function fallbackCopy(s){const t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();showToast('Result copied')}
function showSettings(){popup('Settings',`<div class="switch-row"><div><strong>Hard mode</strong><p class="subtle">Revealed hints must be used in future guesses.</p></div><button class="toggle ${hard?'on':''}" id="hardToggle">${hard?'On':'Off'}</button></div><p>Made for word lovers. No tracking, no accounts, and absolutely no ads.</p><p class="subtle">Daily puzzles use your device’s local date. Stats and game progress are stored only in this browser.</p>`);$('hardToggle').onclick=()=>{hard=!hard;save('ff-hard',hard);showSettings()}}
$('submitBtn').onclick=()=>press('ENTER');$('hintBtn').onclick=useHint;$('giveUpBtn').onclick=giveUp;setInterval(tick,1000);document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseTimer();else{if(state&&!state.done&&state.timerActivated)startTimer();tick()}});window.addEventListener('pagehide',pauseTimer);
$('lengthBtn').onclick=()=>{wordLength=wordLength===5?6:5;save('ff-length',wordLength);if(mode==='daily')loadDaily();else{state=null;newUnlimited()}};
document.querySelectorAll('.keyrow').forEach(row=>{for(const ch of row.dataset.keys){const b=document.createElement('button');b.className='key'+('↵⌫'.includes(ch)?' wide':'');b.textContent=ch==='↵'?'ENTER':ch==='⌫'?'⌫':ch;b.dataset.key=ch;b.setAttribute('aria-label',ch==='↵'?'Enter':ch==='⌫'?'Backspace':ch);b.onclick=()=>press(ch);row.append(b)}});
document.addEventListener('keydown',e=>{if($('backdrop').classList.contains('show')){if(e.key==='Escape')close();return}if(e.ctrlKey||e.altKey||e.metaKey)return;if(/^[a-z]$/i.test(e.key)||e.key==='Enter'||e.key==='Backspace'){e.preventDefault();press(e.key)}});
$('dailyBtn').onclick=loadDaily;$('unlimitedBtn').onclick=()=>{if(mode==='unlimited'){if(state.done)forceNewUnlimited();else showToast('Finish this puzzle first')}else newUnlimited()};$('helpBtn').onclick=showHelp;$('statsBtn').onclick=showResults;$('settingsBtn').onclick=showSettings;$('closeModal').onclick=close;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))close()};
loadDaily();
</script></body></html>
